
spring:
  application:
    name: product-service

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_product_db
    username: root
    password: asif

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info


# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 900000
  refresh-expiration: 604800000
